name: Say hi to Claude

# Sends one tiny Claude Code message so the 5-hour usage window starts now.
# Triggered by the dashboard button (workflow_dispatch). Uncomment the schedule to also do it automatically.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 11 * * 1-5'   # 7:00 AM EDT / 6:00 AM EST, weekdays (GitHub cron is UTC and can run a few minutes late)

jobs:
  hi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Say hi
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: claude -p "Hi Claude! Just starting my usage window for the day. Reply with one short line." --model haiku --max-turns 1
