name: Deploy to Cloudflare

# Every push to main deploys the Worker; the frame notices the new version and reloads within a minute.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'alexa/**', '.github/workflows/claude-hi.yml']
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
